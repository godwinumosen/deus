<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Changed | Deus Magnus Site Checkbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            color: #04245c;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .success-card {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            border: 1px solid #e7edf4;
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 8px 28px rgba(23,55,89,.06);
        }

        .success-icon {
            width: 60px;
            height: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e3f7ec;
            color: #198754;
            font-size: 28px;
            margin-bottom: 18px;
        }

        .btn-primary {
            background: #04245c;
            border-color: #04245c;
            border-radius: 9px;
            padding: 11px 22px;
        }
    </style>
</head>

<body>
<div class="container px-3">
    <div class="success-card">
        <div class="success-icon">✓</div>

        <h2 class="fw-bold mb-2">Password Changed!</h2>

        <p class="text-secondary mb-4">
            Your password has been updated successfully.
            You can continue using your account.
        </p>

        <a href="{% url 'site_checkbook:dashboard' %}"
           class="btn btn-primary">
            Return to Dashboard
        </a>
    </div>
</div>
</body>
</html>
