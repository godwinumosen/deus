{% extends "base.html" %}
{% load static %}
{% block title %}{{ object.blog_deus_magnus_title }} {% endblock %}
{% block content%}

<style>
    .blog-article-content {
        font-size: 16px;
        line-height: 1.9;
        color: #444;
        overflow-wrap: anywhere;
    }

    .blog-article-content h1,
    .blog-article-content h2,object.blog_deus_magnus_title 
    .blog-article-content h3,
    .blog-article-content h4 {
        color: #04245c;
        font-family: Georgia, "Times New Roman", serif;
        margin: 28px 0 14px;
        line-height: 1.3;
    }

    .blog-article-content img {
        max-width: 100%;
        height: auto;
    }

    .blog-article-content a {
        color: #98681e;
        overflow-wrap: anywhere;
    }

    .blog-article-content blockquote {
        border-left: 4px solid #98681e;
        padding-left: 18px;
        color: #666;
    }
</style>


<section class="section db p120">
    <div class="container">
        <div class="row">
            <div class="col-md-12"><br><br>
                <div class="tagline-message page-title text-center">
                    <h3>{{ object.blog_deus_magnus_title }}</h3>
                </div>
            </div><!-- end col -->
        </div><!-- end row -->
    </div><!-- end container -->
</section><!-- end section -->

<section class="section gb nopadtop">
    <div class="container">
        <div class="boxed">
            <div class="row">
                <div class="col-md-11">
                    <div class="content blog-list">
                        <div class="blog-wrapper clearfix">
                            <div class="blog-meta">
                                <ul class="list-inline">
                                    <li><span>Written by Deus Magnus Team</span></li>
                                </ul>
                            </div><!-- end blog-meta -->
                            <div class="blog-media">
                                <img src="{{ object.blog_deus_magnus_img.url }}" alt="" class="img-responsive img-rounded"> 
                            </div><!-- end media -->
                            <div class="blog-desc-big">
                                <p class="lead" style="font-family: Georgia;color: #98681e;">
                                    {{ object.blog_deus_magnus_subtitle }}
                                </p>
                                <div class="blog-article-content">
                                    {{ safe_blog_content|safe }}
                                </div>
                            </div><!-- end desc -->
                        </div><!-- end blog -->
                        <div class="btn-wrapper">
                            <a href=""onclick="history.back(); return false;" class="btn btn-primary"style="border-radius: 5px;font-family: Georgia;"> Back</a>
                        </div>
                    </div><!-- end content -->
                </div><!-- end col -->
                <div class="sidebar col-md-4">
                    <div class="widget clearfix">
                        <div class="banner-widget">
                            <img src="upload/banner.jpeg" alt="" class="img-responsive img-rounded">
                        </div>
                    </div>
                </div><!-- end sidebar -->
            </div><!-- end row -->
        </div><!-- end boxed -->
    </div><!-- end container -->
</section>

{% endblock %}
